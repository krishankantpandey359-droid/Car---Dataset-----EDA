name: Car dataset EDA CI

on:
  push:
    branches: ["main", "audit/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate-and-execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy matplotlib seaborn jupyter nbformat nbclient ipykernel pytest
      - name: Create deterministic CI-only sample dataset
        run: |
          python - <<'PY'
          import pandas as pd
          rows = []
          makes = ["Toyota", "Honda", "Ford", "BMW", "Hyundai"]
          for i in range(40):
              rows.append({
                  "Make": makes[i % len(makes)],
                  "Model": f"Model-{i % 7}",
                  "Year": 2010 + i % 14,
                  "Engine Fuel Type": "Gasoline",
                  "Engine HP": 90 + (i * 17) % 260,
                  "Engine Cylinders": [4, 6, 8][i % 3],
                  "Transmission Type": ["AUTOMATIC", "MANUAL"][i % 2],
                  "Driven_Wheels": ["front wheel drive", "rear wheel drive"][i % 2],
                  "Market Category": "Luxury",
                  "Vehicle Size": "Midsize",
                  "Vehicle Style": "Sedan",
                  "Number of Doors": 4,
                  "Popularity": 1000 + i * 13,
                  "highway MPG": 20 + i % 20,
                  "city mpg": 14 + i % 18,
                  "MSRP": 12000 + i * 1250,
              })
          pd.DataFrame(rows).to_csv("Cars_data.csv", index=False)
          PY
      - name: Validate notebook and run unit tests
        run: |
          python - <<'PY'
          import ast
          import nbformat
          from pathlib import Path
          path = Path("Exploratory Data Analysis of Car Dataset.ipynb")
          notebook = nbformat.read(path, as_version=4)
          nbformat.validate(notebook)
          count = 0
          for index, cell in enumerate(notebook.cells):
              if cell.cell_type != "code":
                  continue
              count += 1
              lines = [line for line in cell.source.splitlines()
                       if not line.lstrip().startswith(("%", "!"))]
              source = "\n".join(lines)
              if source.strip():
                  ast.parse(source)
          if count < 20:
              raise SystemExit(f"Expected at least 20 code cells, found {count}.")
          print(f"Notebook syntax passed ({count} code cells).")
          PY
          python -m pytest -q
      - name: Execute complete notebook on CI sample data
        env:
          MPLBACKEND: Agg
        run: |
          mkdir -p artifacts
          jupyter nbconvert --to notebook --execute \
            "Exploratory Data Analysis of Car Dataset.ipynb" \
            --output "car-eda-executed.ipynb" \
            --output-dir artifacts \
            --ExecutePreprocessor.timeout=600
      - name: Upload executed notebook
        uses: actions/upload-artifact@v4
        with:
          name: car-eda-executed-notebook
          path: artifacts/car-eda-executed.ipynb
          if-no-files-found: error
          retention-days: 14
